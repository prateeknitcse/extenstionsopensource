name: Label PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs with write access, so this workflow never checks out
# or runs PR code. It only reads the list of changed files.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
